name: Dehumidifier
products:
  - id: 6zaodn3fsregdekf
    manufacturer: Arida
    model: Oslo
entities:
  - entity: humidifier
    class: dehumidifier
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 103
        type: string
        name: humidity
        # The app offers "Continuous", then 40-80% in steps of 5.
        # Continuous is exposed as the lowest value, 30%.
        mapping:
          - dps_val: CONTINUOUS
            value: 30
            step: 5
          - dps_val: "40"
            value: 40
            step: 5
          - dps_val: "45"
            value: 45
            step: 5
          - dps_val: "50"
            value: 50
            step: 5
          - dps_val: "55"
            value: 55
            step: 5
          - dps_val: "60"
            value: 60
            step: 5
          - dps_val: "65"
            value: 65
            step: 5
          - dps_val: "70"
            value: 70
            step: 5
          - dps_val: "75"
            value: 75
            step: 5
          - dps_val: "80"
            value: 80
            step: 5
        range:
          min: 30
          max: 80
      - id: 5
        type: string
        name: mode
        mapping:
          - dps_val: AUTO
            value: auto
          - dps_val: LOW
            value: low
          - dps_val: HIGH
            value: high
          - dps_val: SLEEP
            value: sleep
      - id: 6
        type: integer
        name: current_humidity
      - id: 19
        type: bitfield
        name: action
        mapping:
          - dps_val: 0
            value: drying
          - value: idle
  - entity: sensor
    class: temperature
    dps:
      - id: 7
        type: integer
        name: sensor
        unit: C
        class: measurement
  - entity: switch
    translation_key: ionizer
    category: config
    dps:
      - id: 10
        type: boolean
        name: switch
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 105
        type: boolean
        name: lock
  - entity: light
    translation_key: indicator
    category: config
    dps:
      - id: 101
        type: boolean
        name: switch
  - entity: select
    name: Swing
    category: config
    dps:
      - id: 102
        type: string
        name: option
        mapping:
          - dps_val: HOLD
            value: stop
          - dps_val: UP
            value: up
          - dps_val: FRONT
            value: front
          - dps_val: WIDE
            value: wide
  - entity: select
    translation_key: display_brightness
    category: config
    dps:
      - id: 104
        type: string
        name: option
        mapping:
          # Forced by the device in sleep mode, not selectable
          - dps_val: L0
            value: "off"
            hidden: true
          # Labels as shown in the Smart Life app
          - dps_val: L1
            value: L1
          - dps_val: L2
            value: L2
          - dps_val: L3
            value: L3
          - dps_val: L4
            value: L4
          - dps_val: L5
            value: L5
          - dps_val: H
            value: H
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 17
        type: string
        name: option
        mapping:
          - dps_val: CANCEL
            value: cancel
          - dps_val: 1hr
            value: 1h
          - dps_val: 2hr
            value: 2h
          - dps_val: 3hr
            value: 3h
          - dps_val: 4hr
            value: 4h
          - dps_val: 5hr
            value: 5h
          - dps_val: 6hr
            value: 6h
          - dps_val: 7hr
            value: 7h
          - dps_val: 8hr
            value: 8h
          - dps_val: 9hr
            value: 9h
          - dps_val: 10hr
            value: 10h
          - dps_val: 11hr
            value: 11h
          - dps_val: 12hr
            value: 12h
  - entity: binary_sensor
    translation_key: tank_full
    category: diagnostic
    dps:
      - id: 19
        type: bitfield
        name: sensor
        # Bit 4 is FULL; the mask makes this true whatever other bits are set
        mask: "04"
        mapping:
          - dps_val: 1
            value: true
          - value: false
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 19
        type: bitfield
        name: sensor
        mapping:
          # 8 means the target humidity is reached, which is not a fault
          - dps_val: 0
            value: false
          - dps_val: 8
            value: false
          - dps_val: null
            value: false
          - value: true
      - id: 19
        type: bitfield
        name: fault_code
